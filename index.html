<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Joyeux Noël 🎄</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    /* Body et fond animé */
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
        color: white;
        background: url('background.jpg') center/cover no-repeat;
        position: relative;
    }

    /* Overlay sombre rouge */
    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(50,0,0,0.7);
        z-index: 0;
    }

    /* Animation électrique / scintillement du fond */
    .electric {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(255,0,0,0.1), transparent 70%);
        animation: flicker 2s infinite alternate;
        z-index: 1;
    }

    @keyframes flicker {
        0% { opacity: 0.05; }
        25% { opacity: 0.15; }
        50% { opacity: 0.08; }
        75% { opacity: 0.12; }
        100% { opacity: 0.05; }
    }

    /* Carte principale */
    .card {
        position: relative;
        z-index: 2;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(6px);
        padding: 30px 25px;
        border-radius: 16px;
        max-width: 650px;
        margin: auto;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeIn 1.5s forwards;
    }

    /* Emoji et animations texte */
    .emoji {
        font-size: 2em;
        margin-bottom: 10px;
        opacity: 0;
        animation: fadeIn 2s forwards 0.5s;
    }

    h1 {
        font-size: 2.2em;
        margin-bottom: 15px;
        opacity: 0;
        animation: fadeIn 2s forwards 1s, glitchText 2s infinite;
    }

    p {
        font-size: 1.2em;
        line-height: 1.6;
        opacity: 0;
        animation: fadeIn 2s forwards 1.5s;
    }

    /* Bouton rouge qui pulse */
    .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 26px;
        background: #ff3b3b;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        border-radius: 30px;
        transition: transform 0.2s, box-shadow 0.2s;
        animation: fadeIn 2s forwards 2s, pulse 2s infinite alternate;
    }

    .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(255,0,0,0.5);
    }

    /* Animations */
    @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        100% { transform: scale(1.05); }
    }

    @keyframes glitchText {
        0% { text-shadow: 2px 0 #ff0000, -2px 0 #ff0000; }
        20% { text-shadow: -2px 0 #ff0000, 2px 0 #ff0000; }
        40% { text-shadow: 2px 2px #ff0000, -2px -2px #ff0000; }
        60% { text-shadow: -2px 2px #ff0000, 2px -2px #ff0000; }
        80% { text-shadow: 2px -2px #ff0000, -2px 2px #ff0000; }
        100% { text-shadow: 2px 0 #ff0000, -2px 0 #ff0000; }
    }
</style>
</head>
<body>

<div class="overlay"></div>
<div class="electric"></div>

<div class="card">
    <div class="emoji">🎅🎄✨</div>
    <h1>Ho ho ho, Joyeux Noël !</h1>
    <p>Voici une super expérience à faire tous les trois,<br>
       on dirait bien que cette fois c'est le monde à l'envers !!</p>
    <p>Bisous 💕</p>
    <a class="btn" href="https://sandboxvr.com/experience/strangerthings" target="_blank">
        🎮 Découvrez l’expérience Stranger Things
    </a>
</div>

<!-- 🎵 Musique auto-play -->
<audio autoplay loop>
    <source src="musique.mp3" type="audio/mpeg">
    Votre navigateur ne supporte pas la lecture audio.
</audio>

</body>
</html>
