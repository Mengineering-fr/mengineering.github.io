<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Joyeux Noël 🎄</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: url('background.jpg') center/cover no-repeat;
    position: relative;
    overflow: hidden;
}

/* Overlay sombre rouge */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(50,0,0,0.5);
    z-index: 0;
}

/* Bouton cadeau */
.gift-button {
    position: relative;
    z-index: 1;
    margin-top: 40vh;
    width: 120px;
    height: 120px;
    background: #ff3b3b;
    border-radius: 20px;
    border: 4px solid #fff;
    cursor: pointer;
    transition: transform 0.2s;
    font-size: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
}

.gift-button:hover {
    transform: scale(1.1);
}

/* Carte texte cachée */
.card {
    position: relative;
    z-index: 1;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    padding: 30px 25px;
    border-radius: 16px;
    max-width: 650px;
    margin: 40px auto;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s, transform 1s;
}

/* Glitch léger sur le titre */
h1 {
    font-size: 2em;
    margin-bottom: 15px;
    text-shadow: 2px 0 #ff0000, -2px 0 #ff0000;
}

p {
    font-size: 1.2em;
    line-height: 1.6;
}

/* Bouton lien */
.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 26px;
    background: #ff3b3b;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    border-radius: 30px;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 15px rgba(255,0,0,0.5);
}
</style>
</head>
<body>

<div class="overlay"></div>

<!-- Bouton cadeau -->
<div class="gift-button" id="gift">🎁</div>

<!-- Carte texte cachée -->
<div class="card" id="content">
    <div class="emoji">🎅🎄✨</div>
    <h1>Ho ho ho, Joyeux Noël !</h1>
    <p>Voici une super expérience à faire tous les trois,<br>
       on dirait bien que cette fois c'est le monde à l'envers !!</p>
    <p>Bisous 💕</p>
    <a class="btn" href="https://sandboxvr.com/experience/strangerthings" target="_blank">
        🎮 Découvrez l’expérience Stranger Things
    </a>
</div>

<!-- Musique -->
<audio id="bg-music" loop>
    <source src="musique.mp3" type="audio/mpeg">
</audio>

<script>
const gift = document.getElementById('gift');
const content = document.getElementById('content');
const music = document.getElementById('bg-music');

// Au clic sur le cadeau
gift.addEventListener('click', () => {
    gift.style.display = 'none';           // Masquer le cadeau
    content.style.opacity = '1';           // Afficher le texte
    content.style.transform = 'translateY(0)';
    music.play().catch(e => console.log("Musique bloquée :", e)); // Lancer la musique
});
</script>

</body>
</html>
